services:

  app:
    container_name: sftest_app2
    image: sftest2-app:latest
    build:
      context: .
      dockerfile: config/docker/php/Dockerfile
    ports:
      - "${DOCKER_HTTPS_PORT:-44301}:443"
      - "${DOCKER_HTTP_PORT:-8081}:80"
    networks:
      default:
        aliases:
          - sftest2.my
          - pma.sftest2.my
          - nsk.sftest2.my
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sftest2.rule=Host(`sftest2.my`) || HostRegexp(`^[a-z0-9-]+\\.sftest2\\.my$`)"
      - "traefik.http.routers.sftest2.entrypoints=websecure"
      - "traefik.http.routers.sftest2.tls=true"
      - "traefik.http.routers.sftest2.service=sftest2"
      - "traefik.http.services.sftest2.loadbalancer.server.scheme=https"
      - "traefik.http.services.sftest2.loadbalancer.server.port=443"
      - "traefik.http.routers.pma.rule=Host(`pma.sftest2.my`)"
      - "traefik.http.routers.pma.priority=100"
      - "traefik.http.routers.pma.entrypoints=websecure"
      - "traefik.http.routers.pma.tls=true"
      - "traefik.http.routers.pma.service=pma-svc"
      - "traefik.http.services.pma-svc.loadbalancer.server.scheme=https"
      - "traefik.http.services.pma-svc.loadbalancer.server.port=443"
    volumes:
      - .:/www/sftest2
      - vendor:/www/sftest2/vendor
      - var_cache:/www/sftest2/var/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: sftest2
      MYSQL_USER: sftest2
      MYSQL_PASSWORD: sftest2
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./dump.sql.gz:/docker-entrypoint-initdb.d/dump.sql.gz:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  default: {}
  proxy:
    external: true

volumes:
  db_data:
  vendor:
  var_cache:
