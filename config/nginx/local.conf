# HTTP redirect to HTTPS
server {
   listen               80;
   server_name          sftest2.my, *.sftest2.my;
   return               301 https://$host$request_uri;
}

server {
    listen              443 ssl http2;
    ssl                 on;
    ssl_certificate     /www/sftest2/config/ssl/localhost.crt;
    ssl_certificate_key /www/sftest2/config/ssl/localhost.key;

    server_name         sftest2.my, *.sftest2.my;

    access_log          /var/log/nginx/cv.access.log;
    error_log           /var/log/nginx/cv.error.log;
    root                /www/sftest2/public;
    index               index.php;
    charset             utf-8;

    proxy_busy_buffers_size   512k;
    proxy_buffers   4 512k;
    proxy_buffer_size   256k;

    location / {
        if (-f $request_filename) {
            expires max;
            break;
        }
        if ( !-e $request_filename ) {
            rewrite ^(.*) /index.php last;
        }
    }

    location ~ "^(.+\.php)($|/)" {
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_param   SCRIPT_FILENAME   $document_root$fastcgi_script_name;
        fastcgi_param   SCRIPT_NAME       $fastcgi_script_name;
        fastcgi_param   PATH_INFO         $fastcgi_path_info;
        fastcgi_param   HTTP_HOST         $host;
        fastcgi_pass    unix:/run/php/php8.3-fpm.sock;
        include         fastcgi_params;
        # Symfony dev/debug can exceed default 4k/8k FastCGI header buffers (502 on login_check)
        fastcgi_buffer_size       128k;
        fastcgi_buffers           8 128k;
        fastcgi_busy_buffers_size 256k;
    }
}
