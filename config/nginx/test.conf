# HTTP redirect to HTTPS
server {
   listen 80;
   server_name test.cvgun.io test.cvgun.ru;
   return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    ssl on;
    ssl_certificate /etc/ssl/cvgun.io.crt;
    ssl_certificate_key /etc/ssl/cvgun.io.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:DES-CBC3-SHA:!RC4:!aNULL:!eNULL:!MD5:!EXPORT:!EXP:!LOW:!SEED:!CAMELLIA:!IDEA:!PSK:!SRP:!SSLv:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/dhparams.pem;
    ssl_session_timeout 1h;
    ssl_session_cache shared:SSL:16m;

    server_name test.cvgun.io test.cvgun.ru;
    root /www/cv-test/public;

    charset utf-8;
    client_max_body_size 256M;
    error_page 500 502 503 504  /error50x.html;

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # OLD RU domain redirect to RU locale paths
    if ($host = "test.cvgun.ru") {
        return 301 https://test.cvgun.io/ru$request_uri;
    }

    location / {
        if (-f $request_filename) {
            expires max;
            break;
        }
        try_files $uri /index.php$is_args$args;
    }

    # block bad bots
    if ($http_user_agent ~* (semrush|AhrefsBot|BLEXBot|AcoiRoboti|MJ12bot|msnbot|neticle|restclient|mediatoolkit) ) {
          return 403;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_param   SCRIPT_FILENAME   $document_root$fastcgi_script_name;
        fastcgi_param   SCRIPT_NAME       $fastcgi_script_name;
        fastcgi_param   PATH_INFO         $fastcgi_path_info;
        fastcgi_pass    unix:/run/php/php8.3-fpm.sock;
        include         fastcgi_params;
    }
}
