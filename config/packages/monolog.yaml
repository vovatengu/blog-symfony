monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - transliterate # <--- ДОБАВЛЕНО: Создаем канал для нашего сервиса

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!transliterate"] # <--- ИЗМЕНЕНО: Исключаем транслит из общих логов
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # ДОБАВЛЕНО: Наш обработчик для транслита
            transliterate_handler:
                type: stream
                path: "%kernel.logs_dir%/%env(TRANSLITERATE_LOG_FILE)%" # Берет имя из .env
                channels: ["transliterate"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!transliterate"] # <--- ИЗМЕНЕНО: Исключаем транслит
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            # ДОБАВЛЕНО: Наш обработчик для транслита
            transliterate_handler:
                type: stream
                path: "%kernel.logs_dir%/%env(TRANSLITERATE_LOG_FILE)%"
                channels: ["transliterate"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!transliterate"] # <--- ИЗМЕНЕНО: Исключаем транслит
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # ДОБАВЛЕНО: Наш обработчик для транслита
            transliterate_handler:
                type: stream
                path: "%kernel.logs_dir%/%env(TRANSLITERATE_LOG_FILE)%"
                channels: ["transliterate"]
